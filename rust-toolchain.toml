# The loader is built with stable, but the eBPF program is cross-built for
# bpfel-unknown-none via `-Z build-std=core`, which needs nightly + rust-src.
# aya-build (invoked from build.rs) shells out to this toolchain, so pinning it
# here makes local + CI builds reproducible instead of depending on whatever
# nightly happens to be installed. This is the single toolchain source for CI,
# delivery and scripts; Renovate bumps the date and the full CI gate verifies it.
[toolchain]
channel = "nightly-2026-11-17"
# rust-analyzer is only for local editors/LSP tooling; CI downloads it unused.
components = ["rust-src", "clippy", "rustfmt", "rust-analyzer", "llvm-tools"]
# Cross-build targets for the smoke scripts (aarch64 Lima guests) and delivery
# (both). bpfel-unknown-none is tier 3, built via -Z build-std, so not listed.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
