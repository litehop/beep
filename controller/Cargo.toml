[package]
name = "beep-controller"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

# aya + beep-common's "user" feature pull in real bpf(2)/netlink syscalls
# (same as the beep loader), so this crate only builds/runs on Linux.
[dependencies]
beep-common = { path = "../common", features = ["user"] }
beep = { path = ".." }
politeia = { git = "https://github.com/litehop/politeia", tag = "v0.1.1" }
aya = { version = "0.14", default-features = false }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
dhat = { version = "0.3", optional = true }
hyper = "1"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }

# Heap-profiling build for attributing idle RSS to allocation sites -- off
# by default, so the shipped binary never links dhat's allocator wrapper.
[features]
dhat-heap = ["dep:dhat", "tokio/signal"]
