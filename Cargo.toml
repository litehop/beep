[package]
name = "u7s-servicelb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# servicelb-ebpf is a no_std, bpfel-unknown-none crate that cannot compile as
# part of the outer u7s workspace (see the root Cargo.toml's `exclude`).
# Cargo workspace members must be hierarchical, so it nests here instead of
# living alongside this crate; build.rs invokes aya-build to cross-build it
# and embed the resulting object.
[workspace]
members = ["servicelb-ebpf", "servicelb-common"]
resolver = "2"

[profile.release.package.u7s-servicelb-ebpf]
debug = 2
codegen-units = 1
strip = false

[dependencies]
aya = { version = "0.14", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[build-dependencies]
aya-build = "0.2"

[[bin]]
name = "u7s-servicelb"
path = "src/main.rs"
