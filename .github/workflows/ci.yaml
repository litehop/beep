name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The eBPF program (ebpf/) is a #![no_std] bpfel-unknown-none crate cross-built
  # via nightly + bpf-linker + -Z build-std=core; the loader (beep) links
  # Linux-only syscalls (bpf(2), netlink) and only builds on Linux. Both are
  # compiled and linted here.
  ebpf-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: clippy, rustfmt, rust-src
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # ubuntu-latest ships no LLVM, so `cargo install bpf-linker` fails outright;
      # taiki-e/install-action fetches aya-rs/bpf-linker's prebuilt, hash-verified
      # release binary instead.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (beep loader)
        run: cargo clippy --tests -- -D warnings

      # The root workspace's default member is only `beep`; beep-common's host
      # unit/regression tests need an explicit -p, and neither the fmt/clippy
      # steps nor `cargo build` run them. Without this a beep-common regression
      # could be reverted with nothing in CI to catch it.
      - name: Test (beep-common)
        run: cargo test -p beep-common

      # beep-ebpf is #![no_std] and only builds for bpfel-unknown-none; clippy
      # needs the same target + build-std the real build uses, run from ebpf/.
      - name: Clippy (beep-ebpf)
        working-directory: ebpf
        run: cargo clippy --release --target bpfel-unknown-none -Z build-std=core -- -D warnings

      - name: Build beep-ebpf + beep
        run: cargo build --release

  # Loads the real programs and drives one client->VIP->backend round trip
  # natively on ubuntu-latest (no Lima/cross-build), then asserts the discovered
  # map set is EXACTLY the 8 known maps (catches partial-discovery regressions a
  # byte-sum-only check would miss) under a gross-regression bytes_memlock ceiling.
  ebpf-memory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships no bpftool; hash-verified prebuilt from libbpf/bpftool's
      # own GitHub release (same trust pattern as the bpf-linker fetch above).
      - name: Install bpftool
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          curl -sSLO https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz.sha256sum
          sha256sum -c bpftool-v7.7.0-amd64.tar.gz.sha256sum
          sudo tar -xzf bpftool-v7.7.0-amd64.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Install netcat (round-trip backend responder)
        run: sudo apt-get update -y && sudo apt-get install -y netcat-openbsd

      - name: Build beep-ebpf + beep
        run: cargo build --release

      - name: Run smoke fixture (loads real programs, drives one round trip, samples eBPF map memory + loader RSS)
        run: |
          sudo install -m 0755 target/release/beep /tmp/beep-smoke
          sudo bash scripts/smoke-remote.sh run

      - name: Sample eBPF map memory into a fresh, single-tick CSV for the CI assertion
        run: |
          sudo bash scripts/sample-ebpf-memory.sh once \
            --pin-dir /sys/fs/bpf/beep-smoke \
            --out-dir /tmp/beep-ebpf-memory-assert

      - name: Assert the discovered map set is exactly the 8 known maps, under the gross-regression byte ceiling
        run: bash scripts/assert-ebpf-map-memory.sh /tmp/beep-ebpf-memory-assert/ebpf-map-memory.csv

      - name: Cleanup
        if: always()
        run: sudo bash scripts/smoke-remote.sh cleanup
