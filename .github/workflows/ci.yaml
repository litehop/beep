name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component:
          - beep
          - beep-common
          - beep-controller
          # - beep-ebpf
          - beep-kubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          # llvm-tools: build.rs's post-link DWARF strip needs llvm-objcopy;
          # explicit here because this action's `components:` input pins
          # the toolchain via RUSTUP_TOOLCHAIN, bypassing rust-toolchain.toml's
          # own `components` list.
          components: clippy, rustfmt, rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: cargo test -p "${{ matrix.component }}"
  
  test-gate:
    if: ${{ always() }}
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ needs.test-matrix.result != 'success' }}
        run: |
          echo "One or more component tests failed."
          exit 1

  lint-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component:
          - beep
          - beep-common
          - beep-controller
          - beep-ebpf
          - beep-kubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          # llvm-tools: build.rs's post-link DWARF strip needs llvm-objcopy;
          # explicit here because this action's `components:` input pins
          # the toolchain via RUSTUP_TOOLCHAIN, bypassing rust-toolchain.toml's
          # own `components` list.
          components: clippy, rustfmt, rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.component != 'beep-ebpf'
        run: cargo clippy --tests -p "${{ matrix.component }}" -- -D warnings

      - if: matrix.component == 'beep-ebpf'
        # beep-ebpf is #![no_std] and only builds for bpfel-unknown-none; clippy
        # needs the same target + build-std the real build uses, run from ebpf/.
        working-directory: ebpf
        run: cargo clippy --release --target bpfel-unknown-none -Z build-std=core -- -D warnings

      # controller/Cargo.toml's dhat-heap feature is opt-in so the shipped
      # binary never links dhat's profiling allocator; this catches a future
      # edit accidentally making dhat a default/normal dependency.
      - if: matrix.component == 'beep-controller'
        name: Guard the default beep-controller build excludes dhat-heap
        run: |
          set -euo pipefail
          # `if cmd | grep -q ...; then` would silently pass on a cargo-tree
          # error too: grep sees empty stdin, exits 1 (no match), and that's
          # the only exit status the `if` ever sees. Capture cargo tree's own
          # exit status via command substitution so `set -e` catches it.
          tree_output=$(cargo tree -p beep-controller -e normal)
          if grep -q dhat <<< "$tree_output"; then
            echo "FAIL: default beep-controller build pulls in dhat (dhat-heap must stay opt-in)" >&2
            exit 1
          fi

  lint-gate:
    if: ${{ always() }}
    needs: lint-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: ${{ needs.lint-matrix.result != 'success' }}
        run: |
          echo "One or more component lint checks failed."
          exit 1

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: clippy, rustfmt, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: cargo fmt --check

  # Pure host bash tests (no VM, no cargo build, no eBPF) for the Rule-14
  # regression tests scripts/test-*-logic.sh document -- before this job
  # existed, none of them ran anywhere in CI or a git hook, so a fix's own
  # regression test could never actually catch that regression's return.
  # Loops the glob (not a hardcoded name list) so a future scripts/test-*
  # -logic.sh is picked up automatically.
  shell-logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every scripts/test-*-logic.sh
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/test-*-logic.sh; do
            echo "::group::$f"
            if bash "$f"; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  # delivery.yaml cross-compiles beep-controller for aarch64-gnu (in addition
  # to the host amd64 target) via cargo-zigbuild, but test-matrix/lint-matrix
  # above only ever build the host target -- so an arch-specific compile
  # break (rare: arch-specific code, pointer width) would pass PR CI and
  # only surface at release time. Same cross-build technique as
  # delivery.yaml; a debug build is enough to catch a compile break, no
  # need to run the resulting binary.
  controller-cross-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # beep-controller's build.rs cross-builds beep-ebpf via aya-build,
      # which needs nightly + rust-src regardless of the host build's own
      # target; aarch64-unknown-linux-gnu is beep-controller's own target.
      # llvm-tools: build.rs's post-link DWARF strip needs llvm-objcopy.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rust-src, llvm-tools
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same hash-verified prebuilt-binary install as delivery.yaml's
      # bpf-linker + cargo-zigbuild step.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: bpf-linker,cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cargo-zigbuild shells out to `zig cc` as its cross-linker.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Cross-compile beep-controller for aarch64-gnu
        run: cargo +nightly zigbuild -p beep-controller --target aarch64-unknown-linux-gnu.2.36

  # Loads the real programs and drives one client->VIP->backend round trip
  # natively on ubuntu-latest (no Lima/cross-build), then asserts the discovered
  # map set is EXACTLY the 7 known maps (catches partial-discovery regressions a
  # byte-sum-only check would miss) under a gross-regression bytes_memlock ceiling.
  # Also runs the real beep-controller binary against a real single-node k3s
  # apiserver on this same runner and gates its userspace RSS
  # (scripts/memory-smoke-controller.sh) -- the tokio/hyper/rustls/watch-loop
  # weight the eBPF-map-memory check above never measures.
  memory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # llvm-tools: build.rs's post-link DWARF strip needs llvm-objcopy.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships no bpftool; hash-verified prebuilt from libbpf/bpftool's
      # own GitHub release (same trust pattern as the bpf-linker fetch above).
      - name: Install bpftool
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          curl -sSLO https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz.sha256sum
          sha256sum -c bpftool-v7.7.0-amd64.tar.gz.sha256sum
          sudo tar -xzf bpftool-v7.7.0-amd64.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Install netcat (round-trip backend responder)
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y netcat-openbsd

      - name: Build beep-ebpf + beep + beep-controller
        run: cargo build --release -p beep -p beep-controller

      # Guards build.rs's post-link DWARF strip from a
      # silent future revert -- a fresh checkout's target/ has exactly one
      # build.rs invocation, so exactly one OUT_DIR/beep-ebpf to find.
      - name: Assert the embedded eBPF object stays DWARF-stripped
        run: |
          set -euo pipefail
          objects=$(find target/release/build -path '*/out/beep-ebpf')
          count=$(printf '%s\n' "$objects" | grep -c .)
          [ "$count" -eq 1 ] || { echo "FAIL: expected exactly 1 embedded beep-ebpf object, found $count: $objects" >&2; exit 1; }
          bash scripts/assert-ebpf-object-stripped.sh "$objects"

      - name: Run smoke fixture (loads real programs, drives one round trip, samples eBPF map memory + loader RSS)
        run: |
          sudo install -m 0755 target/release/beep /tmp/beep-smoke
          sudo bash scripts/smoke-remote.sh run

      - name: Sample eBPF map memory into a fresh, single-tick CSV for the CI assertion
        run: |
          sudo bash scripts/sample-ebpf-memory.sh once \
            --pin-dir /sys/fs/bpf/beep-smoke \
            --out-dir /tmp/beep-ebpf-memory-assert

      - name: Assert the discovered map set is exactly the 7 known maps, under the gross-regression byte ceiling
        run: bash scripts/assert-ebpf-map-memory.sh /tmp/beep-ebpf-memory-assert/ebpf-map-memory.csv

      # get.k3s.io's own installer (systemd unit + start), same source ci.yaml
      # already trusts nowhere else -- scripts/k3s-up.sh uses the identical
      # install path for the Lima gate. servicelb/traefik/metrics-server/
      # local-storage disabled: beep replaces servicelb, the rest are unused
      # weight this single-node, no-real-workload cluster doesn't need.
      - name: Install single-node k3s (for the beep-controller RSS gate)
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io -o /tmp/k3s-install.sh
          chmod +x /tmp/k3s-install.sh
          sudo INSTALL_K3S_EXEC="server --disable=traefik,servicelb,metrics-server,local-storage" /tmp/k3s-install.sh
          for i in $(seq 1 30); do
            sudo k3s kubectl get --raw=/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          # /readyz alone only means the API server answers -- flannel CNI is
          # still bringing up cni0/flannel.1 and scheduling coredns for a
          # while after that, and was observed leaving the host's rtnl busy
          # enough to fail an unrelated `ip link add` moments later. Waiting
          # for coredns Running is a real signal that this churn has settled.
          for i in $(seq 1 60); do
            phase=$(sudo k3s kubectl -n kube-system get pods -l k8s-app=kube-dns -o jsonpath='{.items[0].status.phase}' 2>/dev/null || true)
            [ "$phase" = "Running" ] && exit 0
            sleep 2
          done
          echo "FAIL: k3s server/coredns did not settle in time" >&2
          sudo k3s kubectl get pods -A >&2 || true
          exit 1

      - name: Run beep-controller against k3s and gate its userspace RSS
        run: sudo bash scripts/memory-smoke-controller.sh run

  # Coverage for Dockerfile's iproute2 addition: the two
  # jobs above run the raw beep-controller binary directly on the runner,
  # never the SHIPPED image, so a missing/broken `ip` on PATH inside it, or
  # a break in node self-prep when run from that image, had zero CI
  # coverage. Builds the same runtime image delivery.yaml ships (native
  # amd64, no cross-build needed since this runner IS that platform), then
  # `docker run`s it to assert `ip` is present and that beep-controller
  # creates `geneve0` and disables its reverse-path filter end-to-end --
  # exactly the two node-prep steps deploy/daemonset.yaml's hostNetwork pod
  # relies on this image providing.
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # llvm-tools: build.rs's post-link DWARF strip needs llvm-objcopy.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build beep-controller and stage it where the Dockerfile expects it
        run: |
          set -euo pipefail
          cargo build --release -p beep-controller
          mkdir -p dist/linux/amd64
          cp target/release/beep-controller dist/linux/amd64/beep-controller

      - name: Build the runtime image
        run: docker build -t beep-controller:ci-smoke .

      - name: Assert `ip` (iproute2) is present on PATH inside the built image
        run: docker run --rm --entrypoint sh beep-controller:ci-smoke -c 'command -v ip && ip -V'

      # --network host: matches deploy/daemonset.yaml's hostNetwork: true,
      # and (practically) means geneve0/rp_filter land in the runner's own
      # netns/procfs, so they're inspectable after the container exits
      # instead of being torn down with its private netns. `--node-prep`
      # (docs/decisions/servicelb-rp-filter-init-container.md) is exactly
      # what deploy/daemonset.yaml's privileged initContainer runs -- it
      # exits on its own once done, so this job only asserts on its side
      # effects, not a full k8s watch.
      #
      # Capabilities + AppArmor mirror deploy/daemonset.yaml's main
      # container securityContext (docs/decisions/servicelb-controller-
      # apparmor-unconfined.md), not the real initContainer's `privileged:
      # true` -- this job's point is confirming the SHIPPED IMAGE's
      # `--node-prep` still works given SOME elevated access, not exercising
      # the initContainer's own privilege requirement end-to-end (that needs
      # a real containerd CRI pod; scripts/smoke-k3s-controller.sh covers
      # it). systempaths=unconfined is docker-CLI-specific and NOT part of
      # that securityContext: dockerd (unlike the containerd/CRI path the
      # real DaemonSet runs under) always bind-mounts /proc/sys read-only
      # regardless of capabilities or --network host, which breaks
      # disable_rp_filter's fs::write -- this only unmasks that docker-CLI
      # default, it grants no extra capability. Device names must stay <=15
      # bytes (IFNAMSIZ) or `ip link add` fails the kernel's own netlink
      # attribute validation on IFLA_IFNAME.
      - name: Run beep-controller from the built image and assert node self-prep (geneve0 + rp_filter=0)
        run: |
          set -euo pipefail
          GENEVE=smoke-geneve0

          echo "==> starting beep-node-prep-smoke"
          docker run -d --name beep-node-prep-smoke \
            --network host \
            --cap-drop=ALL --cap-add=NET_ADMIN --cap-add=BPF --cap-add=PERFMON \
            --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v /sys/fs/bpf:/sys/fs/bpf \
            beep-controller:ci-smoke \
            --geneve-iface "$GENEVE" --node-prep

          timeout 30 docker wait beep-node-prep-smoke >/dev/null || true
          echo "---- beep-node-prep-smoke container logs ----"
          docker logs beep-node-prep-smoke || true

          ip link show "$GENEVE" || { echo "FAIL: $GENEVE was never created by ensure_geneve_iface" >&2; exit 1; }
          all_rpf=$(cat /proc/sys/net/ipv4/conf/all/rp_filter)
          geneve_rpf=$(cat "/proc/sys/net/ipv4/conf/$GENEVE/rp_filter")
          echo "rp_filter: all=$all_rpf $GENEVE=$geneve_rpf"
          [ "$all_rpf" = "0" ] || { echo "FAIL: conf.all.rp_filter=$all_rpf, want 0" >&2; exit 1; }
          [ "$geneve_rpf" = "0" ] || { echo "FAIL: conf.$GENEVE.rp_filter=$geneve_rpf, want 0" >&2; exit 1; }
          echo "CONTAINER NODE-PREP SMOKE: PASS"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f beep-node-prep-smoke >/dev/null 2>&1 || true
          sudo ip link del smoke-geneve0 >/dev/null 2>&1 || true
