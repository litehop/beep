name: Delivery

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to Docker Hub"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A partially-uploaded image is worse than a slow one (same reasoning as
  # u7s's release-tarball.yaml): never cancel a v* tag push mid-publish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Cross-builds beep-controller for both target arches on this one amd64
  # runner (cargo-zigbuild, same cross-build technique scripts/smoke.sh uses
  # for its macOS-host -> Linux-VM build), then COPYs the two prebuilt gnu
  # binaries into a debian:trixie-slim image. This replaces compiling
  # inside the image under QEMU emulation (~37min) with a native/cross
  # build that Swatinem/rust-cache can actually reuse across runs.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 pulls full history + all tags, needed by "Determine
      # image tags" below to find the highest existing v* tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # beep-controller's build.rs cross-builds beep-ebpf via aya-build,
      # which needs nightly + rust-src regardless of the host build's own
      # target. The gnu targets are for beep-controller itself.
      # llvm-tools: build.rs's post-link DWARF strip needs llvm-objcopy.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      # Namespaced by job id automatically, so this doesn't collide with
      # ci.yaml's caches; keyed on Cargo.lock (Swatinem/rust-cache's
      # default add-rust-environment-hash-key), so unrelated source-only
      # commits reuse the full dependency + beep-controller build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Same hash-verified prebuilt-binary install as ci.yaml's bpf-linker
      # step; cargo-zigbuild is also in taiki-e/install-action's tool set.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: bpf-linker,cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cargo-zigbuild shells out to `zig cc` as its cross-linker.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # glibc is pinned to 2.36 via cargo-zigbuild's target-suffix syntax
      # (conservative floor, not tied to the runtime image's glibc); the
      # binary is forward-compatible with debian:trixie-slim's glibc 2.41.
      - name: Cross-build beep-controller (gnu, both arches)
        run: |
          set -euo pipefail
          cargo +nightly zigbuild --release -p beep-controller --target x86_64-unknown-linux-gnu.2.36
          cargo +nightly zigbuild --release -p beep-controller --target aarch64-unknown-linux-gnu.2.36
          mkdir -p dist/linux/amd64 dist/linux/arm64
          cp target/x86_64-unknown-linux-gnu/release/beep-controller dist/linux/amd64/beep-controller
          cp target/aarch64-unknown-linux-gnu/release/beep-controller dist/linux/arm64/beep-controller

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: valerauko
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A `v*` tag push (the release cut procedure in
      # docs/decisions/versioning.md) tags the release version, plus
      # :latest -- but only if this tag is the highest semver `v*` tag, so a
      # backport tag (e.g. v0.1.1 cut after v0.2.0 exists) never regresses
      # :latest to an older line. A branch push (main) tags :sha only: no
      # mutable tip-of-main tag, since daemonset.yaml and the e2e rig both
      # want either an exact commit or the latest release, never "whatever
      # main happened to be last".
      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # The push trigger's `tags: ["v*"]` filter already guarantees
            # this for a real tag push; re-check because workflow_dispatch
            # can be run manually against any ref, including a non-`v` tag.
            case "${{ github.ref_name }}" in
              v*) ;;
              *) echo "error: tag '${{ github.ref_name }}' does not start with 'v'" >&2; exit 1 ;;
            esac
            list="docker.io/valerauko/beep-lb:${{ github.ref_name }}"
            highest=$(git tag --list 'v*' | sort -V | tail -1)
            if [ "${{ github.ref_name }}" = "$highest" ]; then
              list="$(printf '%s\n%s' "$list" "docker.io/valerauko/beep-lb:latest")"
            fi
          else
            list="docker.io/valerauko/beep-lb:${{ github.sha }}"
          fi
          {
            echo "list<<EOF"
            echo "$list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # No QEMU needed: the Dockerfile only COPYs a prebuilt binary per
      # platform, it never RUNs anything for the foreign arch. A manual
      # dispatch defaults to a dry-run build of both arches (push: false);
      # pass push=true, or merge to main, to actually publish.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.tags.outputs.list }}

  # Auto-creates the GitHub Release for a `v*` tag ref, so this step can't
  # be silently skipped (as it was for v0.1.0). Only runs after `image`
  # publishes successfully; the release-create call is idempotent, so a
  # manual workflow_dispatch retry against an existing tag is safe too.
  release:
    needs: image
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Idempotent: a re-run (e.g. this job re-triggered after an earlier
      # unrelated failure) must not hard-fail just because the Release
      # already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, skipping"
            exit 0
          fi
          notes="docs/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
