name: Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-builds beep-controller for both target arches on this one amd64
  # runner (cargo-zigbuild, same cross-build technique scripts/smoke.sh uses
  # for its macOS-host -> Linux-VM build), then COPYs the two prebuilt gnu
  # binaries into a debian:bookworm-slim image. This replaces compiling
  # inside the image under QEMU emulation (~37min) with a native/cross
  # build that Swatinem/rust-cache can actually reuse across runs.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # beep-controller's build.rs cross-builds beep-ebpf via aya-build,
      # which needs nightly + rust-src regardless of the host build's own
      # target. The gnu targets are for beep-controller itself.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      # Namespaced by job id automatically, so this doesn't collide with
      # ci.yaml's caches; keyed on Cargo.lock (Swatinem/rust-cache's
      # default add-rust-environment-hash-key), so unrelated source-only
      # commits reuse the full dependency + beep-controller build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Same hash-verified prebuilt-binary install as ci.yaml's bpf-linker
      # step; cargo-zigbuild is also in taiki-e/install-action's tool set.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: bpf-linker,cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cargo-zigbuild shells out to `zig cc` as its cross-linker; fetch
      # zig's official release directly, hash-verified, same trust pattern
      # as the bpf-linker/bpftool fetches elsewhere in this repo.
      - name: Install zig
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /usr/local
          ln -s /usr/local/zig-x86_64-linux-0.15.2/zig /usr/local/bin/zig
          zig version

      # glibc is pinned to 2.36 (Debian bookworm's version) via
      # cargo-zigbuild's target-suffix syntax, so the binary never requires
      # a glibc newer than the runtime image (debian:bookworm-slim) ships.
      - name: Cross-build beep-controller (gnu, both arches)
        run: |
          set -euo pipefail
          cargo +nightly zigbuild --release -p beep-controller --target x86_64-unknown-linux-gnu.2.36
          cargo +nightly zigbuild --release -p beep-controller --target aarch64-unknown-linux-gnu.2.36
          mkdir -p dist/linux/amd64 dist/linux/arm64
          cp target/x86_64-unknown-linux-gnu/release/beep-controller dist/linux/amd64/beep-controller
          cp target/aarch64-unknown-linux-gnu/release/beep-controller dist/linux/arm64/beep-controller

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: valerauko
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No QEMU needed: the Dockerfile only COPYs a prebuilt binary per
      # platform, it never RUNs anything for the foreign arch.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/valerauko/beep-lb:latest
            docker.io/valerauko/beep-lb:${{ github.sha }}
