name: zmi6-spike
on:
  push:
    branches: [worker/agent-a9e0ae213108bd620]
jobs:
  boot:
    name: boot ${{ matrix.v }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { v: 6.6.158, img: "linux-image-unsigned-6.6.158-0606158-generic_6.6.158-0606158.202610031241_amd64.deb", mod: "linux-modules-6.6.158-0606158-generic_6.6.158-0606158.202610031241_amd64.deb" }
          - { v: 6.12.112, img: "linux-image-unsigned-6.12.112-0612112-generic_6.12.112-0612112.202610031248_amd64.deb", mod: "linux-modules-6.12.112-0612112-generic_6.12.112-0612112.202610031248_amd64.deb" }
    steps:
      - name: kvm
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: install
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y qemu-system-x86 virtme-ng
          vng --version
      - name: fetch kernel
        run: |
          set -euxo pipefail
          base=https://kernel.ubuntu.com/mainline/v${{ matrix.v }}/amd64
          mkdir -p /tmp/k
          cd /tmp/k
          curl -sSfLO $base/${{ matrix.img }}
          curl -sSfLO $base/${{ matrix.mod }}
          mkdir x
          dpkg -x ${{ matrix.img }} x
          sudo dpkg -x ${{ matrix.mod }} /
          ls x/boot /lib/modules
      - name: config
        run: |
          cfg=$(ls /boot/config-${{ matrix.v }}-*)
          for o in BPF_SYSCALL BPF_JIT NET_CLS_BPF NET_ACT_BPF NET_XGRESS GENEVE VETH NET_NS 9P_FS NET_9P_VIRTIO VIRTIO_PCI VIRTIO_BLK OVERLAY_FS DEBUG_INFO_BTF NET_SCH_INGRESS NET_SCH_CLSACT; do grep -E "^CONFIG_$o[= ]|^# CONFIG_$o " $cfg || echo "CONFIG_$o absent"; done
      - name: boot
        run: |
          set -x
          time sudo vng --run /tmp/k/x/boot/vmlinuz-* --user root --verbose --exec 'uname -r; ip -V; which nc bpftool; mount | grep -E " / |bpf"; ls /sys/kernel/btf/vmlinux' 2>&1 | tail -80
