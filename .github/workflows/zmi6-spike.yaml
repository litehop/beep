name: zmi6-spike
on:
  push:
    branches: [worker/agent-a9e0ae213108bd620]
jobs:
  boot:
    name: boot ${{ matrix.v }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { v: 6.6.158, img: "linux-image-unsigned-6.6.158-0606158-generic_6.6.158-0606158.202610031241_amd64.deb", mod: "linux-modules-6.6.158-0606158-generic_6.6.158-0606158.202610031241_amd64.deb" }
          - { v: 6.12.112, img: "linux-image-unsigned-6.12.112-0612112-generic_6.12.112-0612112.202610031248_amd64.deb", mod: "linux-modules-6.12.112-0612112-generic_6.12.112-0612112.202610031248_amd64.deb" }
    steps:
      - name: kvm
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: install
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y qemu-system-x86 virtme-ng netcat-openbsd
          curl -sSLO https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          sudo tar -xzf bpftool-v7.7.0-amd64.tar.gz -C /usr/local/bin bpftool
      - name: fetch kernel
        run: |
          set -euxo pipefail
          base=https://kernel.ubuntu.com/mainline/v${{ matrix.v }}/amd64
          mkdir -p /tmp/k
          cd /tmp/k
          curl -sSfLO $base/${{ matrix.img }}
          curl -sSfLO $base/${{ matrix.mod }}
          mkdir x
          dpkg -x ${{ matrix.img }} x
          sudo dpkg -x ${{ matrix.mod }} /
      - name: boot
        run: |
          printf '%s\n' 'uname -r' 'id' 'ip -V' 'which nc bpftool' 'mount | grep -E " / |bpf"' 'ls /sys/kernel/btf/vmlinux' 'ls /tmp | head' 'echo exit-test; exit 7' > guest.sh
          set +e
          time sudo vng --run /tmp/k/x/boot/vmlinuz-* --user root --verbose --exec "bash $PWD/guest.sh"
          echo "vng rc=$?"
