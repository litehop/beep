# Lima VM for beep-ebpf smoke testing (scripts/smoke.sh) -- a Linux kernel to
# load the compiled eBPF object into and drive real packets through, since
# beep-ebpf only builds for bpfel-unknown-none and beep's loader is
# Linux-only. Debian 13 (trixie), Linux 6.12 LTS. beep-node-a/beep-node-b/
# beep-client stay on Ubuntu 24.04 (lima/beep-k3s.yaml, lima/beep-client.yaml).
#
# Usage:
#   scripts/lima-up.sh [vm-name]

vmType: vz

cpus: 1
memory: "2GiB"
disk: "10GiB"

# Plain unprivileged switch so multiple VMs can reach each other directly.
# Needs no socket_vmnet/sudoers host setup, unlike shared/bridged/host.
networks:
  - lima: user-v2

# Never auto-forward guest listeners onto host loopback: the shared host runs
# other projects on ports a guest can listen on (k3s 6443/6444, kubelet
# 10248-10259). Rigs reach guests over user-v2 or `limactl shell`, never a
# forwarded host port. SSH is forwarded separately from portForwards.
portForwards:
  - guestIP: 0.0.0.0
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
  - guestIP: "::"
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
  - guestIP: 127.0.0.1
    guestPortRange: [1, 65535]
    proto: any
    ignore: true

# Pinned to a dated release + digest; never a floating `latest`/`trixie` path.
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-genericcloud-amd64-20261001-2618.qcow2
    arch: x86_64
    digest: sha512:f46f0671a6e5bdec5291ab8972bae2f10e5408c2f64a74078f11efc2f06a436a9d0313ed50e0472542eeabf780e9f7c792ac0a314c6c20507fcd9fd81b468c3d
  - location: https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-genericcloud-arm64-20261001-2618.qcow2
    arch: aarch64
    digest: sha512:d8470b8c6c38fead046c794b5800a5a7b96672d5bcf543cc230ceb0c4b8ace05ed341a0c8928045422243fde26b2f1f2f58e99244c65709ffda2e3d4b674dd5a

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq

      # bpftool is its own Debian package (not linux-tools-$(uname -r)).
      apt-get install -y bpftool iproute2 procps netcat-openbsd curl jq tcpdump wireguard-tools
