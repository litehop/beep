# RFC 6902 JSON patch (written as YAML) switching the controller from its
# ServiceAccount token to an X.509 client-cert kubeconfig stored in the Secret
# beep-controller-kubeconfig (key "kubeconfig"). Apply with:
#
#   kubectl -n kube-system patch daemonset servicelb-controller \
#     --type=json --patch-file deploy/patches/client-cert-kubeconfig.yaml
#
# See deploy/README.md, "Authentication", for minting the Secret. The two
# removes address the `serviceaccount` volume and its controller mount by
# index (last volume, last mount of daemonset.yaml), so the token is gone and
# only the cert can authenticate.
- op: remove
  path: /spec/template/spec/containers/0/volumeMounts/1
- op: remove
  path: /spec/template/spec/volumes/2
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --kubeconfig=/etc/beep-controller/kubeconfig
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: kubeconfig
    mountPath: /etc/beep-controller
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: kubeconfig
    secret:
      secretName: beep-controller-kubeconfig
