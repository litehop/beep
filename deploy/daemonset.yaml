apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: servicelb-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: servicelb-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: servicelb-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servicelb-controller
    spec:
      serviceAccountName: servicelb-controller
      hostNetwork: true
      # hostNetwork pods need this to resolve in-cluster DNS names correctly;
      # the default dnsPolicy breaks under hostNetwork.
      dnsPolicy: ClusterFirstWithHostNet
      # Runs on every node, including control-plane nodes: the dataplane
      # this controller programs must be present wherever Service traffic
      # can land, not just on worker nodes. CriticalAddonsOnly and the
      # control-plane role taint are two DIFFERENT taints some clusters
      # apply to capacity-constrained control-plane nodes -- tolerating
      # only one won't get this pod scheduled there. (DaemonSet pods get
      # the standard not-ready/unreachable/pressure tolerations injected
      # automatically, so those don't need to be listed here.)
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: servicelb-controller
          image: docker.io/valerauko/beep-lb:latest
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              # No cpu limit: this is a mostly-idle watch loop and a cpu
              # limit would only add throttling risk for no benefit.
              # Memory limit must clear the ~31 MiB transient peak from aya
              # parsing /sys/kernel/btf/vmlinux in load_ebpf (measured with
              # dhat) with headroom, or the controller OOMKills on every
              # startup -- steady-state RSS afterward is ~7 MiB.
              memory: 96Mi
          securityContext:
            privileged: false
            # containerd's default cri-containerd.apparmor.d profile denies
            # ALL bpffs writes (mkdir and BPF_OBJ_PIN) regardless of
            # capabilities -- AppArmor mediation is a separate confinement
            # layer that CAP_BPF/CAP_NET_ADMIN don't reach. Unconfined here
            # is Cilium's own posture for the same reason: non-privileged +
            # AppArmor-unconfined, not privileged:true. See
            # docs/decisions/servicelb-controller-apparmor-unconfined.md.
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              # CAP_PERFMON: the verifier's pointer-arithmetic relaxations
              # for a non-root BPF_PROG_LOAD gate on perfmon_capable(), not
              # just CAP_BPF -- without it the load is rejected outright.
              # See docs/decisions/servicelb-controller-apparmor-unconfined.md.
              # CAP_NET_ADMIN also covers the two node-prep steps this
              # controller does at startup, before attaching anything:
              # creating `geneve0` (`beep::ensure_geneve_iface`) and
              # disabling its reverse-path filter (`beep::disable_rp_filter`
              # -- see its doc comment for why rp_filter=0 is deliberate,
              # not optional).
              add: ["BPF", "NET_ADMIN", "PERFMON"]
          env:
            # hostNetwork means status.hostIP is this node's own address --
            # exactly the value `--node-ip` needs (`ebpf-lb-dataplane.md`'s
            # node-owned-address model: every node advertises its OWN
            # address as the LB front for every Service it fronts).
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            # 10.42.0.0/16 is k3s's own default --cluster-cidr (flannel);
            # override for a cluster provisioned with a different pod CIDR.
            - --pod-cidr=10.42.0.0/16
            - --node-ip=$(NODE_IP)
            - --kubeconfig=/etc/beep-controller/kubeconfig
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: kubeconfig
              mountPath: /etc/beep-controller
              readOnly: true
      volumes:
        # bpffs must already be mounted at this path on the host (it is on
        # any kernel new enough to run this dataplane); pins under it survive
        # container restarts so a rollout doesn't drop established flows.
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        # beep-kubeconfig only parses an X.509 client-cert kubeconfig (no
        # in-cluster ServiceAccount token support yet) -- this Secret must
        # hold one with (at least) the RBAC this DaemonSet's ClusterRole
        # grants (rbac.yaml). Provisioning it is left to the cluster
        # operator/deploy tooling, not this manifest.
        - name: kubeconfig
          secret:
            secretName: beep-controller-kubeconfig
