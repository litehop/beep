apiVersion: v1
kind: ServiceAccount
metadata:
  name: servicelb-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: servicelb-controller
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch", "get"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch", "get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch", "get"]
---
# Cluster-wide flow-hash seed Secret: the first controller to start creates
# it, the rest read it. `create` cannot be limited by resourceNames (the
# apiserver does not know the name at authorization time), so it is scoped
# to this namespace; `get` is limited to the one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: servicelb-controller-flow-hash-seed
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["servicelb-flow-hash-seed"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: servicelb-controller-flow-hash-seed
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: servicelb-controller-flow-hash-seed
subjects:
  - kind: ServiceAccount
    name: servicelb-controller
    namespace: kube-system
---
# Per-node liveness Leases (`beep-node-<node>`): each controller renews its
# own, every controller lists them to prune dead nodes from Service ingress.
# `create` cannot be limited by resourceNames, so the Role is namespace-wide;
# a dedicated namespace keeps that grant away from kube-system, where Lease
# write access would let a compromised beep pod hijack control-plane leader
# election.
apiVersion: v1
kind: Namespace
metadata:
  name: beep-leases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: servicelb-controller-node-lease
  namespace: beep-leases
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: servicelb-controller-node-lease
  namespace: beep-leases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: servicelb-controller-node-lease
subjects:
  - kind: ServiceAccount
    name: servicelb-controller
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: servicelb-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: servicelb-controller
subjects:
  - kind: ServiceAccount
    name: servicelb-controller
    namespace: kube-system
