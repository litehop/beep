# Sizing caps for the front maps. Both are read by the controller through
# `envFrom` in daemonset.yaml; a change needs `kubectl rollout restart
# ds/servicelb-controller -n kube-system` (deploy/README.md, "Configuration").
apiVersion: v1
kind: ConfigMap
metadata:
  name: beep-config
  namespace: kube-system
  labels:
    app.kubernetes.io/name: servicelb-controller
data:
  # Most fronts (front address x Service port x protocol) a node can hold.
  BEEP_MAX_FRONTS: "1024"
  # Endpoints each front is sized for.
  BEEP_ENDPOINTS_PER_FRONT: "4"
  # Idle-flow sweep intervals, in seconds: a flow row no packet matched for
  # 1-2 intervals is deleted. UDP never sooner than the kernel's 120 s stream
  # timeout; the TCP value only backstops flows that vanish without a close
  # (closed connections are reclaimed when their final ACK passes).
  BEEP_UDP_IDLE_SWEEP_SECS: "120"
  BEEP_TCP_IDLE_SWEEP_SECS: "43200"
  # Conntrack rows per node (FLOW_TABLE), preallocated at ~140 B each (2.25
  # MiB at the default). Size for peak concurrent connections across both
  # roles (ingress and backend), including long-idle ones, plus closed ones
  # not yet reclaimed. Small clusters can lower it. Changing it keeps
  # established flows (rows are copied over) unless it shrinks below the rows
  # in use; the overflow resets.
  BEEP_FLOW_TABLE_MAX_ENTRIES: "16384"
