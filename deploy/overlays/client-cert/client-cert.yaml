apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: servicelb-controller
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: servicelb-controller
          volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              $patch: delete
            - name: kubeconfig
              mountPath: /etc/beep-controller
              readOnly: true
      volumes:
        - name: serviceaccount
          $patch: delete
        - name: kubeconfig
          secret:
            secretName: beep-controller-kubeconfig
